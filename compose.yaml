name: substack-engagers

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: substack-engagers:local
    container_name: ps-substack-engagers
    restart: unless-stopped
    init: true
    volumes:
      - reports:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [edge]

networks:
  edge:
    external: true
    name: personal-server-edge

volumes:
  reports:
